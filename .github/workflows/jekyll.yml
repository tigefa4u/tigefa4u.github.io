name: Jekyll Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-26.04
    defaults:
      run:
        shell: bash
    env:
      # Force JavaScript actions to use Node24 (runner default since June 2026)
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.4.11
        bundler: latest

    - name: Install dependencies
      run: bundle install

    - name: Build the site
      run: bundle exec jekyll build --future
